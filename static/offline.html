<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0d0f14" />
		<title>Hors ligne · myLego</title>
		<!-- Page servie par le service worker quand une page n'est pas disponible hors ligne.
		     Autonome (styles en ligne) : elle doit s'afficher sans réseau. -->
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
			}
			html,
			body {
				height: 100%;
			}
			body {
				display: grid;
				place-items: center;
				padding: 24px 16px;
				background: #0d0f14
					radial-gradient(ellipse at 20% 0%, rgba(242, 181, 68, 0.09), transparent 50%);
				color: #f4f1ea;
				font:
					15px/1.4 Manrope,
					system-ui,
					-apple-system,
					sans-serif;
				text-align: center;
			}
			main {
				max-width: 320px;
			}
			.art {
				position: relative;
				width: 168px;
				height: 168px;
				margin: 0 auto 22px;
				border-radius: 50%;
				background: radial-gradient(circle at 50% 38%, #272c3a 0%, #12141b 78%);
			}
			.brick {
				position: absolute;
				left: 50%;
				height: 26px;
				border-radius: 5px;
				box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.22);
			}
			.brick::before,
			.brick::after {
				content: '';
				position: absolute;
				top: -7px;
				width: 14px;
				height: 8px;
				border-radius: 3px 3px 0 0;
				background: inherit;
			}
			.brick::before {
				left: 10px;
			}
			.brick::after {
				right: 10px;
			}
			.b1 {
				top: 102px;
				width: 84px;
				margin-left: -42px;
				background: #f2b544;
			}
			.b2 {
				top: 70px;
				width: 64px;
				margin-left: -36px;
				background: #e5484d;
				transform: rotate(-4deg);
			}
			.b3 {
				top: 40px;
				width: 46px;
				margin-left: -30px;
				background: #3b82f6;
				transform: rotate(-9deg);
			}
			h1 {
				font:
					700 21px 'Space Grotesk',
					system-ui,
					sans-serif;
				margin-bottom: 8px;
			}
			p {
				color: #9a978f;
				margin-bottom: 22px;
			}
			.actions {
				display: grid;
				gap: 10px;
			}
			button {
				height: 50px;
				border: 0;
				border-radius: 14px;
				font: inherit;
				font-weight: 800;
				cursor: pointer;
			}
			.primary {
				background: linear-gradient(135deg, #ffd27a, #e9a12e);
				color: #1a1405;
			}
			.ghost {
				background: transparent;
				color: #f4f1ea;
				border: 1px solid rgba(255, 255, 255, 0.12);
			}
		</style>
	</head>
	<body>
		<main>
			<div class="art" aria-hidden="true">
				<span class="brick b3"></span><span class="brick b2"></span><span class="brick b1"></span>
			</div>
			<h1>Pas disponible hors ligne</h1>
			<p>
				Cette page n’a pas encore été ouverte avec du réseau. Reconnecte-toi pour l’afficher, ou
				reviens à une page déjà consultée.
			</p>
			<div class="actions">
				<button class="primary" type="button" onclick="location.reload()">Réessayer</button>
				<button class="ghost" type="button" onclick="history.length > 1 ? history.back() : (location.href = '/catalogue')">
					Retour
				</button>
			</div>
		</main>
	</body>
</html>
